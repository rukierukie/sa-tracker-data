name: Update prices

on:
  schedule:
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch prices
        run: python3 scripts/fetch_build.py

      - name: Commit and push if changed
        run: |
          git config user.name "sa-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/dashboard_data.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update prices $(date -u +%Y-%m-%d)"
          git push
# trigger reindex
